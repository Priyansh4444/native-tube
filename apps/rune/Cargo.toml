[package]
name = "nt-rune"
version = "0.1.0"
edition = "2024"
description = "NativeTube, the Rune frontend."

[[bin]]
name = "nt-rune"
path = "src/main.rs"

[dependencies]
nt-core = { path = "../../core" }
# Without "embedded-fonts": the app embeds the shared Roboto faces itself (assets/fonts), so
# Rune's bundled Inter is not needed. The rest are Rune's defaults; "metal-backend" matters on
# macOS only (it plugs into wgpu's custom backend on Apple targets alone).
rune = { git = "https://github.com/anomalyco/rune", rev = "4fbd2d6ac4dd12595dd8ed0b7849b28a309c7c00", default-features = false, features = ["accessibility", "dbus", "metal-backend", "svg"] }
rune-kit = { git = "https://github.com/anomalyco/rune", rev = "4fbd2d6ac4dd12595dd8ed0b7849b28a309c7c00" }

[target.'cfg(target_os = "linux")'.dependencies]
libloading = "0.8"

# Rune's README: an app that builds Rune applies its [patch.crates-io] too (a dependency's
# [patch] doesn't reach the workspace that depends on it). Same repository and rev.
[patch.crates-io]
wgpu-hal = { git = "https://github.com/anomalyco/rune", rev = "4fbd2d6ac4dd12595dd8ed0b7849b28a309c7c00" }
winit = { git = "https://github.com/anomalyco/rune", rev = "4fbd2d6ac4dd12595dd8ed0b7849b28a309c7c00" }

# Same release profile as the GPUI app (iced uses the defaults, which are the same apart from
# codegen-units): no incremental release builds, which cost cross-unit inlining.
[profile.release]
debug = false
codegen-units = 16
incremental = false

[workspace]

[lints.clippy]
unwrap_used = "deny"
expect_used = "deny"
panic = "deny"
string_slice = "deny"
todo = "deny"
unimplemented = "deny"
unreachable = "deny"
unchecked_time_subtraction = "deny"
