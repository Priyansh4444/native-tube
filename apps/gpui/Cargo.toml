[package]
name = "nt-gpui"
version = "0.1.0"
edition = "2024"
description = "NativeTube, the GPUI frontend."

[[bin]]
name = "nt-gpui"
path = "src/main.rs"

[dependencies]
nt-core = { path = "../../core" }
gpui = { package = "gpui-pre", version = "=0.3.12" }
gpui-component = "0.9.1"
gpui_platform = { package = "gpui-pre-platform", version = "=0.3.12" }
gpui-kit-assets = "0.9.1"
async-channel = "2"
image = { version = "0.25", default-features = false }
smallvec = "1"
serde_json = "1"

[target.'cfg(target_os = "linux")'.dependencies]
gpui_platform = { package = "gpui-pre-platform", version = "=0.3.12", features = ["wayland"] }
# Keeps the screen from blanking while a video plays (xdg-desktop-portal Inhibit). Already in
# the tree through GPUI's Linux backend.
ashpd = { version = "0.13", default-features = false, features = ["async-io", "inhibit"] }

[profile.release]
debug = false
codegen-units = 16

[workspace]
exclude = ["vendor"]

# GPUI's Wayland backend ignores wl_pointer.axis_stop (touchpad finger lift), which the
# Chromium fling model needs. This is the crates.io source with a 30-line patch; see NOTES.md.
[patch.crates-io]
gpui-pre-linux = { path = "vendor/gpui-pre-linux" }
