[package]
name = "nt-iced"
version = "0.1.0"
edition = "2024"
description = "NativeTube, the iced frontend."

[[bin]]
name = "nt-iced"
path = "src/main.rs"

[dependencies]
nt-core = { path = "../../core" }
iced = { version = "0.14", default-features = false, features = [
    "wgpu",
    "advanced",
    "image-without-codecs",
    "crisp",
    "svg",
    "tokio",
] }
iced_runtime = "0.14"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tokio = { version = "1", features = ["time", "sync"] }

[target.'cfg(target_os = "linux")'.dependencies]
iced = { version = "0.14", default-features = false, features = ["wayland", "x11"] }

[profile.release]
debug = false

[workspace]

[lints.clippy]
unwrap_used = "deny"
expect_used = "deny"
panic = "deny"
string_slice = "deny"
todo = "deny"
unimplemented = "deny"
unreachable = "deny"
unchecked_time_subtraction = "deny"
