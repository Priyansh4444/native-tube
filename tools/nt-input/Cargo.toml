[package]
name = "nt-input"
version = "0.1.0"
edition = "2024"
description = "Real pointer input (click, wheel, touchpad fling, drag) into a NativeTube app on its headless output, through Hyprland's wlr-virtual-pointer support."

[dependencies]
wayland-client = "0.31"
wayland-protocols-wlr = { version = "0.3", features = ["client"] }
serde_json = "1"

